<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title></title>
__SHELL_STYLE__
<link rel="stylesheet" href="/pdfjs/web/pdf_viewer.css">
<style>
  .zfo-message-info { user-select: text; -webkit-user-select: text; }
  .zfo-message-info .kind { margin: 2px 0 8px; }
  .zfo-message-info dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 0; }
  .zfo-message-info dd { margin: 0; color: var(--text); overflow-wrap: anywhere; white-space: pre-line; }
  .zfo-events { width: min(760px, calc(100% - 48px)); box-sizing: border-box; margin: 24px auto; padding: 24px 28px; background: #fff; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 8px 28px rgba(0, 0, 0, .10); user-select: text; -webkit-user-select: text; }
  .zfo-events h2 { margin: 0 0 8px; font-size: 15px; }
  .zfo-events ol { margin: 0; padding-left: 20px; }
  .zfo-events li { margin-bottom: 4px; }
  .zfo-events li time { color: var(--muted); margin-right: 8px; }
  .zfo-notice.zfo-foreign-seal { background: #fde7e6; color: #8a1c17; font-weight: 600; }
</style>
</head>
<body class="zfo-app help-hidden">

<header class="zfo-bar">
  <div class="zfo-group">
    <button class="zfo-btn icon" data-action="open" data-native hidden title="Otevřít dokument (⌘O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H3z"/><path d="M3 10h18l-2 9H5z"/></svg>
    </button>
  </div>
  <div data-file-tools></div>
  <div class="zfo-spacer"></div>
  <div class="zfo-group">
    <button class="zfo-btn icon active" data-action="panel" title="Informace o zprávě a pečeti (⌥⌘2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><circle cx="12" cy="13" r="3"/><path d="M10.5 15.5 10 20l2-1 2 1-.5-4.5"/></svg>
    </button>
  </div>
</header>

<div class="zfo-notice" data-notice role="alert" hidden><span></span><button title="Zavřít upozornění">✕</button></div>

<main class="zfo-stage">
  <article class="zfo-events" data-events hidden>
    <h2>Události</h2>
    <ol data-event-list></ol>
  </article>
</main>

<aside class="zfo-panel">
  <h2>Informace <button class="zfo-close" data-action="panel" title="Skrýt panel">✕</button></h2>
  <h2>Zpráva</h2>
  <div class="zfo-info zfo-message-info">
    <b data-subject></b>
    <div class="kind" data-kind></div>
    <dl data-fields></dl>
  </div>
  <section data-attachments hidden>
    <h2 data-attachments-title></h2>
    <div class="zfo-files" data-attachment-list></div>
  </section>
  <h2>Pečeť</h2>
  <div data-signatures></div>
  <h2>Podání</h2>
  <div class="zfo-info" data-submitted></div>
</aside>

<footer class="zfo-status">
  <span class="file">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>
    <span data-file></span>
  </span>
  <span>·</span>
  <span class="msg" data-status>Zpráva je jen ke čtení</span>
</footer>

<script src="/bridge.js"></script>
<script src="/files.js"></script>
<script type="application/json" data-zfo-page>__PAGE_DATA__</script>
<script src="/message.js"></script>
</body>
</html>
