<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Stahuji číselníky</title>
__SHELL_STYLE__
<style>
  body.zfo-codelists-page { display: block; overflow: auto !important; }
  .zfo-codelists { max-width: 420px; margin: 18vh auto 0; padding: 0 24px; text-align: center; }
  .zfo-codelists h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .zfo-codelists p { color: var(--muted); margin: 0 0 18px; }
  .zfo-codelists progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .zfo-codelists [data-progress-text] { color: var(--muted); margin: 8px 0 22px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="zfo-app zfo-codelists-page">
<main class="zfo-codelists">
  <h1>Stahuji číselníky formuláře</h1>
  <p>Formulář nabízí položky ze seznamů Ministerstva práce a&nbsp;sociálních věcí. Blanketa je stáhne z&nbsp;mpsv.gov.cz a&nbsp;uloží pro příští otevření. Z&nbsp;formuláře se nic neposílá.</p>
  <progress max="1" value="0"></progress>
  <div data-progress-text>Připravuji…</div>
  <button class="zfo-btn" data-skip>Otevřít formulář bez nich</button>
</main>
<script type="application/json" data-zfo-page>__PAGE_DATA__</script>
<script src="/codelists.js"></script>
</body>
</html>
