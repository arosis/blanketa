<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title></title>
__SHELL_STYLE__
<link rel="stylesheet" href="/pdfjs/web/pdf_viewer.css">
</head>
<body class="zfo-app help-hidden">

<header class="zfo-bar">
  <div data-file-tools></div>
  <div class="zfo-spacer"></div>
  <div class="zfo-group">
    <button class="zfo-btn icon active" data-action="panel" title="Informace o&nbsp;kontejneru a&nbsp;podpisech (⌥⌘2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><circle cx="12" cy="13" r="3"/><path d="M10.5 15.5 10 20l2-1 2 1-.5-4.5"/></svg>
    </button>
  </div>
</header>

<main class="zfo-stage"></main>

<aside class="zfo-panel">
  <h2>Informace <button class="zfo-close" data-action="panel" title="Skrýt panel">✕</button></h2>
  <h2>Kontejner</h2>
  <div class="zfo-info" data-info></div>
  <div data-warnings></div>
  <h2>Soubory v&nbsp;kontejneru</h2>
  <div class="zfo-files" data-files></div>
  <h2>Elektronické podpisy</h2>
  <div data-signatures></div>
</aside>

<footer class="zfo-status">
  <span class="file">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>
    <span data-file></span>
  </span>
  <span>·</span>
  <span class="msg" data-status>Otevírám kontejner…</span>
</footer>

<script src="/bridge.js"></script>
<script src="/files.js"></script>
<script type="application/json" data-zfo-page>__PAGE_DATA__</script>
<script src="/container.js"></script>
</body>
</html>
