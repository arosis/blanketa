# Builds and starts Blanketa for macOS, Windows and Linux, and on a version tag (v*) publishes a release.
# Runs after every merge into main, for pull requests that change packaging or dependencies, by hand from the Actions
# tab, or by pushing a tag that matches VERSION:  git tag v0.2.1 && git push origin v0.2.1
# Not required by main's ruleset, so the paths filter cannot leave a pull request waiting for a check that never starts.
name: Build and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - Dockerfile.linux-build
      - VERSION
      - assets/**
      - build.sh
      - desktop.py
      - macapp/**
      - macsign/**
      - packaging/**
      - requirements*.txt
      - tools/build_desktop.py
      - tools/check-deb-starts.sh
      - winsign.ps1
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # Pull requests and main already have them from tests.yml; a release must not depend on that having happened.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  version:
    name: Check the tag against VERSION
    # Packages are named after VERSION and release tags cannot be moved or deleted, so a mismatch must not get published.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"
            exit 1
          fi

  macos:
    name: Package for macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - name: Build app
        run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: blanketa-macos, path: "dist/Blanketa-*-macos.*"}

  windows:
    name: Package for Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Python environment
        shell: bash
        run: |
          python -m pip install -q --require-hashes --only-binary :all: -r requirements-build.txt
          python -m pip install -q --require-hashes --only-binary :all: --no-binary proxy-tools --no-build-isolation -r requirements-desktop.txt
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build app and installer
        run: python tools/build_desktop.py
      - name: Smoke test of the built app
        shell: pwsh
        run: |
          function Save-Screenshot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $shot.Save("$PWD\dist\$name")
          }
          # The first start of a fresh build can be slow (Defender scans it); a crash shows an error dialog,
          # which the screenshot catches.
          $server = Start-Process dist\Blanketa\Blanketa.exe -PassThru -ArgumentList '--serve', '--file', "$PWD\samples-pdf\zadost.pdf", '8700' `
            -RedirectStandardOutput dist\serve-out.txt -RedirectStandardError dist\serve-err.txt
          $page = $null
          foreach ($i in 1..90) {
            try { $page = Invoke-WebRequest http://127.0.0.1:8700/ -UseBasicParsing; break } catch { Start-Sleep 1 }
            if ($server.HasExited) { break }
          }
          if (-not $page) {
            Save-Screenshot 'windows-server-failed.png'
            Get-Content dist\serve-out.txt, dist\serve-err.txt -ErrorAction SilentlyContinue
            throw "server did not answer (exited: $($server.HasExited), code: $($server.ExitCode))"
          }
          if ($page.Content -notmatch 'pdf.html|zfoNative|SESSION') { throw 'page did not render' }
          Stop-Process $server
          Start-Process dist\Blanketa\Blanketa.exe -ArgumentList "$PWD\samples\cssz-onz\form.zfo"
          Start-Sleep 45
          Save-Screenshot 'windows-screenshot.png'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blanketa-windows
          path: |
            dist/Blanketa-*-setup.exe
            dist/Blanketa-*-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: windows-screenshot, path: "dist/windows-*.png\ndist/serve-*.txt", if-no-files-found: ignore}

  linux:
    name: Package for Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: System libraries (bundled by PyInstaller) and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libnss3 libasound2 libxfixes3 libsnappy1v5 libopus0 libminizip1 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libfontconfig1 libdbus-1-3 libxkbfile1 libxshmfence1 libgbm1 xvfb imagemagick
      - name: Python environment
        shell: bash
        run: |
          python -m pip install -q --require-hashes --only-binary :all: -r requirements-build.txt
          python -m pip install -q --require-hashes --only-binary :all: --no-binary proxy-tools --no-build-isolation -r requirements-desktop.txt
      - name: Build app and packages
        # The default xz level is several times slower, for a smaller file that only a released .deb is worth.
        env: {DEB_COMPRESSION_LEVEL: "${{ github.ref_type != 'tag' && '1' || '' }}"}
        run: python tools/build_desktop.py
      - name: Install and start the .deb on the other supported systems
        run: |
          for image in \
            debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 \
            debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 \
            ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 \
            ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c; do
            docker run --rm -v "$PWD:/repo:ro" "$image" sh /repo/tools/check-deb-starts.sh
          done
      - name: Install the .deb and take a screenshot
        run: |
          sudo apt-get install -y -q ./dist/blanketa_*_amd64.deb
          Xvfb :9 -screen 0 1400x1000x24 & sleep 2
          DISPLAY=:9 blanketa samples/cssz-onz/form.zfo &
          sleep 45
          DISPLAY=:9 import -window root dist/linux-screenshot.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blanketa-linux
          path: |
            dist/blanketa_*.deb
            dist/blanketa-*-linux-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: linux-screenshot, path: dist/linux-screenshot.png, if-no-files-found: ignore}

  docker:
    name: Build the Linux build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f Dockerfile.linux-build -t blanketa-build .

  release:
    name: Publish release
    # The release environment waits for the owner's approval before anything is published.
    environment: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, tests, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "blanketa-*", merge-multiple: true, path: release}
      - name: Publish release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Blanketa ${GITHUB_REF_NAME#v}" --generate-notes
