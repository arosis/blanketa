# Builds Blanketa for macOS, Windows and Linux, tests signing on each, and on a version tag (v*) publishes a release.
# Runs for every pull request into main (main's ruleset requires the three platform jobs), by hand from the Actions
# tab, or by pushing a tag that matches VERSION:  git tag v0.1.1 && git push origin v0.1.1
name: Build, test and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Python environment
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Engine tests
        run: .venv/bin/python -I tests/test_engine.py
      - name: Signing selftest (test keychain)
        run: |
          (cd macsign && swiftc -O -suppress-warnings macsign.swift -o macsign)
          tools/make-test-pki.sh
          .venv/bin/python -I tools/selftest.py test
          # Renders forms, which asks macsign for trust verdicts: it runs once macsign is built.
          .venv/bin/python -I tests/test_security.py
          .venv/bin/python -I tests/test_app.py
      - name: Build app
        run: ./build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: blanketa-macos, path: "dist/Blanketa-*-macos.*"}

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Python environment
        run: python -m pip install -q -r requirements-desktop.txt pyinstaller==6.22.3
      - name: Engine tests
        run: |
          python -X utf8 -I tests/test_engine.py
          # Without UTF-8 mode on purpose: the built app has the system code page, and so must the code it runs.
          python -I tests/test_security.py
          python -I tests/test_app.py
      - name: Signing selftest (Windows certificate store and PFX file)
        shell: pwsh
        run: |
          bash tools/make-test-pki.sh
          $password = ConvertTo-SecureString test -AsPlainText -Force
          Import-PfxCertificate -FilePath pki\user.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          python -X utf8 -I tools/selftest.py system
          python -X utf8 -I tools/selftest.py test
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build app and installer
        run: python tools/build_desktop.py
      - name: Smoke test of the built app
        shell: pwsh
        run: |
          function Save-Screenshot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $shot.Save("$PWD\dist\$name")
          }
          # The first start of a fresh build can be slow (Defender scans it); a crash shows an error dialog,
          # which the screenshot catches.
          $server = Start-Process dist\Blanketa\Blanketa.exe -PassThru -ArgumentList '--serve', '--file', "$PWD\samples-pdf\zadost.pdf", '8700' `
            -RedirectStandardOutput dist\serve-out.txt -RedirectStandardError dist\serve-err.txt
          $page = $null
          foreach ($i in 1..90) {
            try { $page = Invoke-WebRequest http://127.0.0.1:8700/ -UseBasicParsing; break } catch { Start-Sleep 1 }
            if ($server.HasExited) { break }
          }
          if (-not $page) {
            Save-Screenshot 'windows-server-failed.png'
            Get-Content dist\serve-out.txt, dist\serve-err.txt -ErrorAction SilentlyContinue
            throw "server did not answer (exited: $($server.HasExited), code: $($server.ExitCode))"
          }
          if ($page.Content -notmatch 'pdf.html|zfoNative|SESSION') { throw 'page did not render' }
          Stop-Process $server
          Start-Process dist\Blanketa\Blanketa.exe -ArgumentList "$PWD\samples\cssz-onz\form.zfo"
          Start-Sleep 45
          Save-Screenshot 'windows-screenshot.png'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blanketa-windows
          path: |
            dist/Blanketa-*-setup.exe
            dist/Blanketa-*-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: windows-screenshot, path: "dist/windows-*.png\ndist/serve-*.txt", if-no-files-found: ignore}

  linux:
    name: Build and test on Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: System libraries (bundled by PyInstaller) and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libnss3 libasound2 libxfixes3 libsnappy1v5 libopus0 libminizip1 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libfontconfig1 libdbus-1-3 libxkbfile1 libxshmfence1 libgbm1 xvfb imagemagick
      - name: Python environment
        run: python -m pip install -q -r requirements-desktop.txt pyinstaller==6.22.3
      - name: Engine tests
        run: |
          python -I tests/test_engine.py
          python -I tests/test_security.py
          python -I tests/test_app.py
      - name: Test coverage (informational)
        run: |
          python -m pip install -q coverage==7.17.0
          for t in tests/test_engine.py tests/test_security.py tests/test_app.py; do
            python -m coverage run --append --source=. --omit="tests/*,tools/*,vendor/*" "$t" > /dev/null
          done
          python -m coverage report --sort=cover
          { echo '### Test coverage'; echo '```'; python -m coverage report --sort=cover; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Signing selftest (PFX file)
        run: tools/make-test-pki.sh && python -I tools/selftest.py test
      - name: Build app and packages
        run: python tools/build_desktop.py
      - name: Install the .deb and take a screenshot
        run: |
          sudo apt-get install -y -q ./dist/blanketa_*_amd64.deb
          Xvfb :9 -screen 0 1400x1000x24 & sleep 2
          DISPLAY=:9 blanketa samples/cssz-onz/form.zfo &
          sleep 45
          DISPLAY=:9 import -window root dist/linux-screenshot.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blanketa-linux
          path: |
            dist/blanketa_*.deb
            dist/blanketa-*-linux-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: linux-screenshot, path: dist/linux-screenshot.png, if-no-files-found: ignore}

  release:
    name: Publish release
    # The release environment waits for the owner's approval before anything is published.
    environment: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "blanketa-*", merge-multiple: true, path: release}
      - name: Publish release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Blanketa ${GITHUB_REF_NAME#v}" --generate-notes
