# Code quality checks for every pull request into main. The tests of all three platforms run in tests.yml, code
# scanning in codeql.yml; main's ruleset requires all of them before a merge. Packages are built in build.yml.
name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Python tools
        run: python -m pip install --quiet --require-hashes --only-binary :all: -r requirements-ci.txt
      - name: Python (ruff)
        run: ruff check --output-format github .
      - name: JavaScript syntax
        run: node --check ui/bridge.js
      - name: XSLT is well-formed
        run: python -c "from lxml import etree; etree.XSLT(etree.parse('ui/fo2html.xsl'))"
      - name: Workflows (actionlint)
        run: |
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check --quiet -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
