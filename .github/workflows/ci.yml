# Code quality checks for every pull request into main. The tests and packages of all three platforms run in
# build.yml, code scanning in codeql.yml; main's ruleset requires all of them before a merge.
name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Python (ruff)
        run: |
          python -m pip install --quiet ruff==0.17.3
          ruff check --output-format github .
      - name: JavaScript syntax
        run: node --check ui/bridge.js
      - name: XSLT is well-formed
        run: |
          python -m pip install --quiet "$(grep -i '^lxml' requirements.txt)"
          python -c "from lxml import etree; etree.XSLT(etree.parse('ui/fo2html.xsl'))"
      - name: Workflows (actionlint)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
