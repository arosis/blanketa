# Weekly coverage-guided fuzzing of the code that reads untrusted files (tools/fuzz.py). A finding fails the run, keeps
# the input as an artifact and opens one issue; the issue says only where to look, the input stays out of it.
name: Fuzzing

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [zfo-signatures, zfo-description, pdf, certificate, trust-list, revocation-list]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Python environment
        run: |
          python -m pip install -q --require-hashes --only-binary :all: -r requirements-fuzz.txt
      - name: Fuzz for ten minutes
        env:
          TARGET: ${{ matrix.target }}
        run: python -I tools/fuzz.py "$TARGET" 600
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz-findings/
          if-no-files-found: ignore

  report:
    name: Report findings
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fuzzing našel chybu při čtení souboru"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --label bug --body "Týdenní běh selhal: $RUN. Vstupy jsou v artefaktech běhu, přehrají se příkazem \`python -I tools/fuzz.py --replay <cíl> <soubor>\`."
          fi
