# Weekly update pull requests for the Python dependencies, the pinned GitHub Actions and the Docker image; they go
# through the same CI and review as any other change. Minor and patch updates come grouped in one pull request per
# ecosystem. Python versions and hashes change in requirements*.txt, which tools/lock-requirements.sh generated. When
# an update brings a new indirect dependency, pip refuses it for a missing hash: run that script on the update's branch.
# Docker updates are checked by the image build in build.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    ignore:
      # pyHanko 0.38 (its opentype extra) accepts uharfbuzz below 0.56 only; lift this with the next pyHanko.
      - dependency-name: uharfbuzz
        versions: [">=0.56"]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    ignore:
      # Stays on the LTS release, whose security updates still arrive as new digests of the same tag. Moving to the
      # next LTS changes the system libraries of the Linux packages, so it is done by hand.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
