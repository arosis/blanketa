# Weekly update pull requests for the Python dependencies and the pinned GitHub Actions; they go through the same CI
# and review as any other change. Minor and patch updates come grouped in one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
